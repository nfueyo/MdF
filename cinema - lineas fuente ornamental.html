<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuente ornamental — Cinemática</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--ink:#17202a;--muted:#68737f;--border:#d8dee6;--grid:#e2e7ed;--stream:#2563a6;--path:#d55e00;--streak:#009e73;--vel:#606a75;--accent:#538cd5}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1250px;margin:auto;padding:18px} h1{font-size:22px;margin:0 0 5px}.sub{font-size:14px;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:15px;margin-top:15px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px}
#plot{display:block;width:100%;height:auto;background:white;border-radius:8px;touch-action:none;cursor:grab} #plot.dragging{cursor:grabbing}
.controls label{display:block;margin:0 0 13px;font-size:14px}.controls input[type=range]{width:100%}.check{display:flex!important;gap:8px;align-items:center;margin:8px 0!important}.check input{width:18px;height:18px}
button{border:1px solid #c8d0d9;background:#fff;border-radius:8px;padding:9px 12px;font-size:14px;cursor:pointer;min-height:40px}.primary{background:var(--accent);border-color:var(--accent);color:white}
.row{display:flex;gap:7px;flex-wrap:wrap}.legend{font-size:13px;line-height:1.9;margin-top:9px}.sw{display:inline-block;width:22px;height:4px;border-radius:3px;margin-right:7px;vertical-align:middle}
.help{margin-top:12px;padding:10px;background:#f3f5f7;border-radius:8px;font-size:13px;line-height:1.5;color:var(--muted)}
output{font-variant-numeric:tabular-nums}.status{margin-top:9px;font-size:13px;color:var(--muted)}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Fuente ornamental: cinemática no estacionaria</h1>
<div class="sub">u = u₀ sin[ω(t − y/v₀)] &nbsp;&nbsp;·&nbsp;&nbsp; v = v₀</div>

<div class="layout">
<section class="card">
<svg id="plot" viewBox="0 0 840 620" role="img" aria-label="Línea de corriente, trayectoria, traza y vectores velocidad">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#606a75"/></marker></defs>
<rect width="840" height="620" fill="white"/>
<g id="world"><g id="grid"></g><g id="axes"></g><g id="vectors"></g>
<path id="stream" fill="none" stroke="#2563a6" stroke-width="4" vector-effect="non-scaling-stroke"/>
<path id="pathline" fill="none" stroke="#d55e00" stroke-width="4" vector-effect="non-scaling-stroke"/>
<path id="streak" fill="none" stroke="#009e73" stroke-width="4" vector-effect="non-scaling-stroke"/>
<circle id="particle" r="7" fill="#d55e00" vector-effect="non-scaling-stroke"/>
<circle id="source" r="6" fill="#17202a" vector-effect="non-scaling-stroke"/></g>
</svg>
<div class="row" style="margin-top:10px">
<button id="zoomIn" type="button">＋ Zoom</button><button id="zoomOut" type="button">− Zoom</button><button id="zoomReset" type="button">Ajustar vista</button>
</div>
<div class="legend"><div><span class="sw" style="background:#2563a6"></span>Línea de corriente</div><div><span class="sw" style="background:#d55e00"></span>Trayectoria de la partícula emitida en t₀</div><div><span class="sw" style="background:#009e73"></span>Traza</div></div>
<div class="help">Zoom: rueda/trackpad sobre el gráfico, o botones. Puedes arrastrar el gráfico para desplazar la vista. Doble clic restablece el encuadre.</div>
</section>

<aside class="card controls">
<div class="row" style="margin-bottom:15px"><button id="play" type="button" class="primary">▶ Animar</button><button id="reset" type="button">Reiniciar</button></div>
<label><b>Tiempo t = <output id="to">3.14</output></b><input id="t" type="range" min="0" max="12.566" step=".01" value="3.142"></label>
<label><b>Emisión t₀ = <output id="t0o">1.57</output></b><input id="t0" type="range" min="0" max="6.283" step=".01" value="1.571"></label>
<label>u₀ = <output id="uo">1.00</output><input id="u0" type="range" min=".2" max="2.5" step=".05" value="1"></label>
<label>v₀ = <output id="vo">1.00</output><input id="v0" type="range" min=".2" max="2.5" step=".05" value="1"></label>
<label>ω = <output id="wo">1.00</output><input id="w" type="range" min=".25" max="2.5" step=".05" value="1"></label>
<hr>
<label class="check"><input id="cs" type="checkbox" checked> Línea de corriente</label>
<label class="check"><input id="cp" type="checkbox" checked> Trayectoria</label>
<label class="check"><input id="ct" type="checkbox" checked> Traza</label>
<label class="check"><input id="cv" type="checkbox" checked> Vectores velocidad</label>
<div id="status" class="status"></div>
</aside>
</div>
</main>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const W=840,H=620,p={l:65,r:30,t:25,b:55};
let playing=false,raf=null,last=0;
let zoom=1,panX=0,panY=0,drag=false,dragX=0,dragY=0,startPanX=0,startPanY=0;

function vals(){return {t:Number($("t").value),t0:Number($("t0").value),u:Number($("u0").value),v:Number($("v0").value),w:Number($("w").value)}}
function range(){const a=vals();const ymax=4*Math.PI*a.v/a.w;const xmax=Math.max(2.4*a.u/a.w,1.25*a.u*ymax/a.v);return{xmin:-xmax,xmax:xmax,ymin:0,ymax:ymax}}
function map(x,y,r){return[p.l+(x-r.xmin)/(r.xmax-r.xmin)*(W-p.l-p.r),H-p.b-(y-r.ymin)/(r.ymax-r.ymin)*(H-p.t-p.b)]}
function ln(x1,y1,x2,y2,attrs){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" '+(attrs||"")+'/>'}
function curve(fn,ymax,n,r){let d="";for(let i=0;i<=n;i++){const y=ymax*i/n,x=fn(y),q=map(x,y,r);d+=(i?"L":"M")+q[0].toFixed(2)+","+q[1].toFixed(2)}return d}
function setTransform(){$("world").setAttribute("transform","translate("+panX+" "+panY+") scale("+zoom+")")}
function drawBackground(r){
 let g="";
 for(let i=0;i<=10;i++){const x=r.xmin+(r.xmax-r.xmin)*i/10,a=map(x,0,r),b=map(x,r.ymax,r);g+=ln(a[0],a[1],b[0],b[1],'stroke="#e2e7ed" stroke-width="1" vector-effect="non-scaling-stroke"')}
 for(let j=0;j<=10;j++){const y=r.ymax*j/10,a=map(r.xmin,y,r),b=map(r.xmax,y,r);g+=ln(a[0],a[1],b[0],b[1],'stroke="#e2e7ed" stroke-width="1" vector-effect="non-scaling-stroke"')}
 $("grid").innerHTML=g;
 const o=map(0,0,r),top=map(0,r.ymax,r),le=map(r.xmin,0,r),ri=map(r.xmax,0,r);
 $("axes").innerHTML=ln(le[0],o[1],ri[0],o[1],'stroke="#4a5560" stroke-width="2" vector-effect="non-scaling-stroke"')+
 ln(o[0],o[1],top[0],top[1],'stroke="#4a5560" stroke-width="2" vector-effect="non-scaling-stroke"')+
 '<text x="'+(ri[0]-8)+'" y="'+(o[1]+32)+'" text-anchor="end" font-size="18">x</text><text x="'+(top[0]+13)+'" y="'+(top[1]+20)+'" font-size="18">y</text>';
 $("source").setAttribute("cx",o[0]);$("source").setAttribute("cy",o[1]);
}
function drawVectors(r){
 if(!$("cv").checked){$("vectors").innerHTML="";return}
 const a=vals();let s="";const nx=10,ny=9,scale=27/Math.max(a.u,a.v);
 for(let j=1;j<=ny;j++){const y=r.ymax*j/(ny+1);for(let i=1;i<=nx;i++){const x=r.xmin+(r.xmax-r.xmin)*i/(nx+1),ux=a.u*Math.sin(a.w*(a.t-y/a.v)),q=map(x,y,r);
 s+=ln(q[0],q[1],q[0]+ux*scale,q[1]-a.v*scale,'stroke="#606a75" stroke-width="1.5" marker-end="url(#arrow)" opacity=".72" vector-effect="non-scaling-stroke"')}}
 $("vectors").innerHTML=s;
}
function update(){
 const a=vals(),r=range();
 $("to").textContent=a.t.toFixed(2);$("t0o").textContent=a.t0.toFixed(2);$("uo").textContent=a.u.toFixed(2);$("vo").textContent=a.v.toFixed(2);$("wo").textContent=a.w.toFixed(2);
 drawBackground(r);drawVectors(r);
 $("stream").style.display=$("cs").checked?"":"none";$("pathline").style.display=$("cp").checked?"":"none";$("streak").style.display=$("ct").checked?"":"none";$("particle").style.display=$("cp").checked?"":"none";
 $("stream").setAttribute("d",curve(y=>a.u/a.w*(Math.cos(a.w*(a.t-y/a.v))-Math.cos(a.w*a.t)),r.ymax,300,r));
 $("pathline").setAttribute("d",curve(y=>a.u/a.v*y*Math.sin(a.w*a.t0),r.ymax,150,r));
 const ys=Math.min(r.ymax,Math.max(0,a.v*a.t));
 $("streak").setAttribute("d",curve(y=>a.u/a.v*y*Math.sin(a.w*(a.t-y/a.v)),ys,260,r));
 const age=Math.max(0,a.t-a.t0),y=a.v*age,x=a.u*Math.sin(a.w*a.t0)*age,q=map(x,Math.min(y,r.ymax),r);
 $("particle").setAttribute("cx",q[0]);$("particle").setAttribute("cy",q[1]);
 $("particle").style.visibility=(a.t>=a.t0&&y<=r.ymax)?"visible":"hidden";
 $("status").textContent="Zoom: "+zoom.toFixed(2)+"× · partícula: u="+(a.u*Math.sin(a.w*a.t0)).toFixed(2)+", v="+a.v.toFixed(2);
 setTransform();
}
["t","t0","u0","v0","w","cs","cp","ct","cv"].forEach(id=>$(id).addEventListener("input",update));
function tick(now){if(!playing)return;const dt=Math.min((now-last)/1000,.05);last=now;let t=Number($("t").value)+dt;if(t>Number($("t").max))t=0;$("t").value=String(t);update();raf=requestAnimationFrame(tick)}
$("play").addEventListener("click",function(){playing=!playing;this.textContent=playing?"❚❚ Pausar":"▶ Animar";if(playing){last=performance.now();raf=requestAnimationFrame(tick)}else if(raf)cancelAnimationFrame(raf)});
$("reset").addEventListener("click",()=>{$("t").value="3.142";$("t0").value="1.571";$("u0").value="1";$("v0").value="1";$("w").value="1";zoom=1;panX=panY=0;update()});
function doZoom(f,cx=W/2,cy=H/2){const old=zoom;zoom=Math.max(.5,Math.min(6,zoom*f));const ratio=zoom/old;panX=cx-(cx-panX)*ratio;panY=cy-(cy-panY)*ratio;setTransform();$("status").textContent="Zoom: "+zoom.toFixed(2)+"×";}
$("zoomIn").addEventListener("click",()=>doZoom(1.25));$("zoomOut").addEventListener("click",()=>doZoom(.8));$("zoomReset").addEventListener("click",()=>{zoom=1;panX=panY=0;setTransform();update()});
$("plot").addEventListener("dblclick",()=>{zoom=1;panX=panY=0;update()});
$("plot").addEventListener("wheel",e=>{e.preventDefault();const rect=$("plot").getBoundingClientRect(),cx=(e.clientX-rect.left)*W/rect.width,cy=(e.clientY-rect.top)*H/rect.height;doZoom(e.deltaY<0?1.12:.89,cx,cy)},{passive:false});
$("plot").addEventListener("pointerdown",e=>{drag=true;dragX=e.clientX;dragY=e.clientY;startPanX=panX;startPanY=panY;$("plot").setPointerCapture(e.pointerId);$("plot").classList.add("dragging")});
$("plot").addEventListener("pointermove",e=>{if(!drag)return;const rect=$("plot").getBoundingClientRect();panX=startPanX+(e.clientX-dragX)*W/rect.width;panY=startPanY+(e.clientY-dragY)*H/rect.height;setTransform()});
$("plot").addEventListener("pointerup",e=>{drag=false;$("plot").classList.remove("dragging");try{$("plot").releasePointerCapture(e.pointerId)}catch(_){}});
update();
})();
</script>
</body></html>
