<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cinema - VxP - Y ahora 3D — línea de corriente como intersección de superficies</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--blue:#538cd5;--red:#c94c5c;--ink:#17202a;--muted:#68717b;--panel:#f5f7fa}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:white}
header{padding:18px 24px 8px}
h1{font-size:24px;margin:0 0 5px;color:#1268a5} .sub{color:var(--muted);font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:end;margin:10px 24px 4px;padding:13px 16px;background:var(--panel);border-radius:10px}
.control{display:flex;flex-direction:column;gap:5px}.control label{font-size:13px;font-weight:650}
input[type=number]{width:90px;padding:7px 8px;border:1px solid #cbd2d9;border-radius:6px;font-size:14px}
input[type=range]{width:260px}.tval{font-variant-numeric:tabular-nums;min-width:55px;display:inline-block}
button{padding:7px 12px;border:1px solid #b9c2cc;background:white;border-radius:7px;cursor:pointer;font-weight:600}
button:hover{background:#eef3f8}
#plot{width:100%;height:calc(100vh - 180px);min-height:560px}
.note{position:absolute;right:28px;top:28px;font-size:12px;color:#7b858f}
@media(max-width:700px){#plot{height:70vh}.note{display:none}}
</style>
</head>
<body>
<header>
  <h1>cinema - VxP - Y ahora 3D</h1>
  <div class="sub">La línea de corriente se representa como la intersección de las dos superficies de la solución.</div>
</header>

<div class="controls">
  <div class="control"><label for="a">Parámetro a</label><input id="a" type="number" value="2" step="0.1"></div>
  <div class="control"><label for="b">Parámetro b</label><input id="b" type="number" value="1" step="0.1"></div>
  <div class="control" style="min-width:290px">
    <label for="t">Tiempo t = <span id="tval" class="tval">1.00</span></label>
    <input id="t" type="range" min="-2" max="4" value="1" step="0.02">
  </div>
  <button id="iso">Vista isométrica</button>
  <button id="front">Vista frontal</button>
  <button id="reset">Restablecer</button>
</div>

<div id="plot"></div>

<script>
const blue='#538cd5', red='#c94c5c';
const el=id=>document.getElementById(id);

function linspace(a,b,n){let q=[];for(let i=0;i<n;i++)q.push(a+(b-a)*i/(n-1));return q}
function finite(x){return Number.isFinite(x) && Math.abs(x)<1e6}

function draw(keepCamera=true){
  const a=+el('a').value, b=+el('b').value, t=+el('t').value;
  el('tval').textContent=t.toFixed(2);
  if(!finite(a)||!finite(b)||Math.abs(a)<1e-6||Math.abs(b)<1e-6){
    Plotly.purge('plot'); el('plot').innerHTML='<div style="padding:40px">a y b deben ser distintos de cero.</div>'; return;
  }

  // Positive y is used because the explicit solution contains real powers of y.
  const ys=linspace(0.35,2.4,48);
  const zs=linspace(-1.5,7.0,48);

  // Surface 1: x = y^(-2/a), extruded in z.
  let X1=[],Y1=[],Z1=[];
  for(const z of zs){
    let xr=[],yr=[],zr=[];
    for(const y of ys){xr.push(Math.pow(y,-2/a));yr.push(y);zr.push(z)}
    X1.push(xr);Y1.push(yr);Z1.push(zr);
  }

  // Surface 2: y = [(3t-bz)/(3t-3b)]^(a/b).
  // For robust real-valued plotting we parameterize it equivalently by y:
  // z = [3t-(3t-3b)y^(b/a)]/b, extruded in x.
  const xs=linspace(0.25,3.4,48);
  let X2=[],Y2=[],Z2=[];
  for(const y of ys){
    let xr=[],yr=[],zr=[];
    const z=(3*t-(3*t-3*b)*Math.pow(y,b/a))/b;
    for(const x of xs){xr.push(x);yr.push(y);zr.push(z)}
    X2.push(xr);Y2.push(yr);Z2.push(zr);
  }

  // Intersection = streamline.
  let xc=[],yc=[],zc=[];
  for(const y of linspace(0.35,2.4,220)){
    const x=Math.pow(y,-2/a);
    const z=(3*t-(3*t-3*b)*Math.pow(y,b/a))/b;
    if(finite(x)&&finite(z)){xc.push(x);yc.push(y);zc.push(z)}
  }

  const data=[
    {type:'surface',x:X1,y:Y1,z:Z1,opacity:.48,showscale:false,
     colorscale:[[0,blue],[1,blue]],name:'x = y⁻²ᐟᵃ',hoverinfo:'skip'},
    {type:'surface',x:X2,y:Y2,z:Z2,opacity:.45,showscale:false,
     colorscale:[[0,'#e8a0a9'],[1,red]],name:'segunda superficie',hoverinfo:'skip'},
    {type:'scatter3d',mode:'lines',x:xc,y:yc,z:zc,
     line:{color:'#20252b',width:8},name:'Línea de corriente',
     hovertemplate:'x=%{x:.3f}<br>y=%{y:.3f}<br>z=%{z:.3f}<extra></extra>'},
    {type:'scatter3d',mode:'markers+text',x:[1],y:[1],z:[3],
     marker:{size:6,color:'#111'},text:['  (1, 1, 3)'],textposition:'middle right',
     textfont:{size:13,color:'#111'},name:'Punto dado',hoverinfo:'skip'}
  ];

  const old = el('plot')._fullLayout?.scene?.camera;
  const camera = keepCamera && old ? old : {eye:{x:1.55,y:1.55,z:1.15},up:{x:0,y:0,z:1}};
  const layout={
    margin:{l:0,r:0,t:28,b:0},showlegend:true,
    legend:{x:.02,y:.98,bgcolor:'rgba(255,255,255,.8)'},
    scene:{
      camera,
      aspectmode:'cube',
      xaxis:{title:'x',range:[0,3.5],gridcolor:'#d9dee4',zerolinecolor:'#aeb7c0'},
      yaxis:{title:'y',range:[0,2.5],gridcolor:'#d9dee4',zerolinecolor:'#aeb7c0'},
      zaxis:{title:'z',range:[-1.5,7],gridcolor:'#d9dee4',zerolinecolor:'#aeb7c0'},
      bgcolor:'white'
    },
    paper_bgcolor:'white'
  };
  Plotly.react('plot',data,layout,{responsive:true,displaylogo:false,scrollZoom:true});
}

['a','b'].forEach(id=>el(id).addEventListener('input',()=>draw(true)));
el('t').addEventListener('input',()=>draw(true));
el('iso').onclick=()=>Plotly.relayout('plot',{'scene.camera':{eye:{x:1.55,y:1.55,z:1.15},up:{x:0,y:0,z:1}}});
el('front').onclick=()=>Plotly.relayout('plot',{'scene.camera':{eye:{x:0,y:-2.6,z:0},up:{x:0,y:0,z:1}}});
el('reset').onclick=()=>{el('a').value=2;el('b').value=1;el('t').value=1;draw(false)};
draw(false);
</script>
</body>
</html>
