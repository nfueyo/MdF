der-top:1px solid var(--line);padding:22px 0;font-size:13px;color:var(--muted)}footer .wrap{display:flex;justify-content:space-between;gap:20px}@media(min-width:1500px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:0 24px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:0 18px}header{padding:34px 0}.card{min-height:210px}footer .wrap{display:block}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}@media print{.card{break-inside:avoid;box-shadow:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
