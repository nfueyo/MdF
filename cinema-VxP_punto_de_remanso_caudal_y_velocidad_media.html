<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caudal a través del plano z=2</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#20242a}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{padding:10px 14px;background:white;border-bottom:1px solid #ddd;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
label{font-size:14px;display:flex;align-items:center;gap:8px} input[type=range]{width:150px}
button{padding:7px 12px} #plots{display:grid;grid-template-columns:1fr 1fr;min-height:0}
.panel{position:relative;min-width:0;min-height:460px;border-right:1px solid #ddd;background:white}.panel:last-child{border-right:0}
.title{position:absolute;z-index:2;left:12px;top:10px;background:rgba(255,255,255,.88);padding:5px 8px;border-radius:6px;font-weight:600;pointer-events:none}
.plot{position:absolute;inset:0}
@media(max-width:800px){#plots{grid-template-columns:1fr}.panel{min-height:460px;border-right:0;border-bottom:1px solid #ddd}}
</style></head><body>
<div id="app">
<header>
<label>Densidad <input id="density" type="range" min="3" max="16" value="12" step="1"><span id="dv">12×12</span></label>
<label>Tamaño <input id="scale" type="range" min=".12" max=".65" value=".34" step=".01"><span id="sv">0.34</span></label>
<button id="reset">Restablecer vista</button><span style="font-size:13px;color:#666">Arrastrar: ambos giran simultáneamente · rueda/pellizco: zoom · misma escala vectorial en ambos</span>
</header>
<div id="plots">
<section class="panel"><div class="title">Campo completo sobre z = 2 — vectores con flecha</div><div id="full" class="plot"></div></section>
<section class="panel"><div class="title">Solo componente normal: vₙ = 2x² k — segmentos sin flecha</div><div id="normal" class="plot"></div></section>
</div></div>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script>
const density=document.getElementById('density'),scale=document.getElementById('scale'),dv=document.getElementById('dv'),sv=document.getElementById('sv');
const camera0={eye:{x:1.55,y:1.55,z:1.25},up:{x:0,y:0,z:1},center:{x:0,y:0,z:0}};
let sharedCamera=structuredClone(camera0);
let syncing=false;
function grid(n){let p=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++)p.push([1+2*i/(n-1),3*j/(n-1),2]);return p}
function plane(){return {type:'mesh3d',x:[1,3,3,1],y:[0,0,3,3],z:[2,2,2,2],i:[0,0],j:[1,2],k:[2,3],color:'#bcd7f4',opacity:.25,hoverinfo:'skip',showscale:false}}
function fullArrows(n,s){
 let p=grid(n),xs=[],ys=[],zs=[],hx=[],hy=[],hz=[],hu=[],hv=[],hw=[];
 const vref=18; // SAME velocity-to-length scale in both panels
 p.forEach(q=>{
   let [x,y,z]=q,u=x*x-1,v=x*y-2,w=x*x*z;
   // No normalization: graphical vector components are proportional to physical components.
   let ex=s*u/vref, ey=s*v/vref, ez=s*w/vref;
   xs.push(x,x+ex*.78,null);ys.push(y,y+ey*.78,null);zs.push(z,z+ez*.78,null);
   hx.push(x+ex*.78);hy.push(y+ey*.78);hz.push(z+ez*.78);
   hu.push(ex*.22);hv.push(ey*.22);hw.push(ez*.22);
 });
 return [
 {type:'scatter3d',mode:'lines',x:xs,y:ys,z:zs,line:{width:5,color:'#538cd5'},hoverinfo:'skip'},
 {type:'cone',x:hx,y:hy,z:hz,u:hu,v:hv,w:hw,anchor:'tail',sizemode:'absolute',
  sizeref:Math.max(.12,s*.48),colorscale:[[0,'#538cd5'],[1,'#538cd5']],showscale:false,hoverinfo:'skip'}
 ];
}
function normalSegments(n,s){
 let p=grid(n),xs=[],ys=[],zs=[];
 // Reference scaling: at x=3 (vn=18) the segment length is s.
 // Hence segment length is proportional to vn=2x^2.
 p.forEach(q=>{
   let [x,y,z]=q, vn=2*x*x, L=s*vn/18;
   xs.push(x,x,null); ys.push(y,y,null); zs.push(z,z+L,null);
 });
 return {type:'scatter3d',mode:'lines',x:xs,y:ys,z:zs,
         line:{width:6,color:'#538cd5'},hoverinfo:'skip'};
}
function layout(cam){return {margin:{l:0,r:0,b:0,t:0},showlegend:false,dragmode:'orbit',
 scene:{camera:cam,aspectmode:'manual',aspectratio:{x:1,y:1.25,z:1},
 xaxis:{title:'x',range:[0,4],dtick:1,zeroline:false},
 yaxis:{title:'y',range:[0,4],dtick:1,zeroline:false},
 zaxis:{title:'z',range:[0,4],dtick:1,zeroline:false},bgcolor:'#fff'}}}
function bind(id,otherId){
 const el=document.getElementById(id);
 el.removeAllListeners&&el.removeAllListeners('plotly_relayout');
 el.on('plotly_relayout',e=>{
   if(!e['scene.camera'] || syncing) return;
   sharedCamera=e['scene.camera'];
   syncing=true;
   Plotly.relayout(otherId,{'scene.camera':sharedCamera});
   requestAnimationFrame(()=>{syncing=false;});
 });
}
async function draw(){
 let n=+density.value,s=+scale.value;dv.textContent=n+'×'+n;sv.textContent=s.toFixed(2);
 await Plotly.react('full',[plane(),...fullArrows(n,s)],layout(sharedCamera),{responsive:true,displaylogo:false,scrollZoom:true});
 await Plotly.react('normal',[plane(),normalSegments(n,s)],layout(sharedCamera),{responsive:true,displaylogo:false,scrollZoom:true});
 bind('full','normal');bind('normal','full');
}
density.addEventListener('input',draw);scale.addEventListener('input',draw);
document.getElementById('reset').addEventListener('click',()=>{sharedCamera=structuredClone(camera0);draw()});
draw();
</script></body></html>
